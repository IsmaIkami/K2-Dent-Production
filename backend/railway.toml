# Railway.app Configuration for K2 Dent Backend
# Documentation: https://docs.railway.app/deploy/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
# Les variables seront configurées dans Railway Dashboard
# Ne pas mettre de secrets ici!
NODE_ENV = "production"
PORT = "3000"
HOST = "0.0.0.0"
LOG_LEVEL = "info"
