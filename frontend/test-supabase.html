            html += `<li>window.K2_CONFIG: ${typeof window.K2_CONFIG}</li>`;

            html += `<li>window.DB: ${typeof window.DB}</li>`;

            if (typeof window.initSupabase === 'function') {
                const initialized = window.initSupabase();
                html += `<li>initSupabase() result: ${initialized}</li>`;
            } else {
                html += `<li style="color: red;">❌ initSupabase not loaded!</li>`;
