# Nixpacks Configuration for Railway
# Build configuration for monorepo structure
# IMPORTANT: Node.js 22+ required for Supabase WebSocket support

[phases.setup]
nixPkgs = ["nodejs-22_x"]
nixLibs = []

[phases.install]
cmds = [
  "node --version",
  "cd backend && npm ci"
]

[phases.build]

[start]
cmd = "node --version && node server.js"
