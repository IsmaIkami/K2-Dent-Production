# Nixpacks Configuration for Railway
# Build configuration for monorepo structure

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "ls -la",
  "cd backend && npm ci",
  "ls -la"
]

[phases.build]
cmds = ["echo 'Files in build:' && ls -la && cat server.js"]

[start]
cmd = "ls -la && node server.js"
