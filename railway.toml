# Railway Configuration - K2 Dent Backend
# This tells Railway to build and run from the backend directory

[build]
builder = "NIXPACKS"
watchPaths = ["backend/**"]

[deploy]
startCommand = "cd backend && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "3000"
HOST = "0.0.0.0"
LOG_LEVEL = "info"
